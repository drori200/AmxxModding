name: Build AMXX plugins

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install 32-bit compiler runtime
        run: sudo apt-get update && sudo apt-get install -y lib32stdc++6 lib32z1
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: amxx-modding-cstrike
          path: dist/
          if-no-files-found: error
